- name: Generate lines from template
  set_fact:
    host_lines: |
      {{ groups['minio01'][0] }} minio1
      {{ groups['minio_others01'][0] }} minio2
      {{ groups['minio_others02'][0] }} minio3
      {{ groups['minio_others03'][0] }} minio4

- name: "Add lines to /etc/hosts"
  lineinfile:
    path: "/etc/hosts"
    line: "{{ item }}"
    state: present
  loop: "{{ host_lines.split('\n') }}"