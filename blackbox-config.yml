modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200, 301, 302, 404, 405]
      method: GET
      no_follow_redirects: false
      tls_config:
        insecure_skip_verify: false     
        # This item is about whether to skip certificate verification when monitoring https URLs. If it is false, without configuring other trusted certificates, it may be impossible to monitor https links and SSL certificates.
      preferred_ip_protocol: "ip4"
  
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      valid_status_codes: [200, 201, 301, 302, 404, 405]
      headers:
        Content-Type: application/json
      body: '{}'
  
  tcp_connect:
    prober: tcp
    timeout: 5s
  
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"
