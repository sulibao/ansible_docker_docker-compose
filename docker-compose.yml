version: '3'

services:
  prometheus:
    image: ${prometheus_image}
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules.yml:/etc/prometheus/rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: always
    networks:
      - monitor_network

  alertmanager:
    image: ${alertmanager_image}
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: always
    networks:
      - monitor_network

  grafana:
    image: ${grafana_image}
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/default-provider.yaml:/etc/grafana/provisioning/dashboards/default-provider.yaml
      - ./dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${grafana_user}
      - GF_SECURITY_ADMIN_PASSWORD=${grafana_password}
      - prometheus_url=http://${monitor_host}:9090
    restart: always
    networks:
      - monitor_network

  pushgateway:
    image: ${pushgateway_image} 
    container_name: pushgateway
    ports:
      - "9091:9091"
    restart: always
    networks:
      - monitor_network

  node-exporter:
    image: ${nodeexporter_image}
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always
    networks:
      - monitor_network

  # snmp-exporter:
  #   image: ${snmp_image}
  #   container_name: snmap
  #   ports:
  #     - "9116:9116"
  #   restart: always
  #   environment:
  #     - SNMP_EXPORTER_TARGETS=${monitor_host}:9116
  #   networks:
  #     - monitor_network

volumes:
  grafana_data:    
    driver: local
    name: grafana_data

networks:
  monitor_network:
    driver: bridge
    name: monitor_network